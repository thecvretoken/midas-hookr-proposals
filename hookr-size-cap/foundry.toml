# MidasSizeCapAdvisory, built and tested against Hookr's contracts at the commit pin.sh checks out. The compiler
# settings are hookr-1's (solc 0.8.37, via-IR, optimizer 200 runs, prague); v4-core's PoolManager fixture builds with
# 0.8.26, the version it is deployed with, as hookr-1's own test build does. Run `bash pin.sh` first.
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
remappings = [
    "hookr/=lib/hookr-contracts/hookr-1/src/",
    "hookr-test/=lib/hookr-contracts/hookr-1/test/",
    "@uniswap/v4-core/=lib/hookr-contracts/lib/v4-core/",
    "forge-std/=lib/hookr-contracts/lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/hookr-contracts/lib/v4-core/lib/openzeppelin-contracts/contracts/",
    "solmate/=lib/hookr-contracts/lib/v4-core/lib/solmate/",
]
auto_detect_remappings = false
auto_detect_solc = true
compilation_restrictions = [
    { paths = "src/**", version = "=0.8.37" },
    { paths = "test/fixtures/PoolManagerArtifact.sol", version = "=0.8.26" },
    { paths = "test/*.t.sol", version = "=0.8.37" },
]
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "prague"
bytecode_hash = "ipfs"
ffi = false
# Forge looks up a contract by name (deployCode("PoolManager.sol:PoolManager") in Hookr's fixture) only among the
# artifacts of the files a filtered run selects; this lets a filtered or cached run read the PoolManager from out/.
unchecked_cheatcode_artifacts = true
# The kit reads the block's selectors and runtime from its own build artifact.
fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 256

[lint]
lint_on_build = false
